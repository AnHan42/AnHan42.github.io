# Theme metadata
name = "Light"

[light]
  # Primary
  primary = "hsl(250, 85%, 58%)"  # Modern indigo/violet accent

  # Menu
  menu_primary = "rgba(255, 255, 255, 0.90)"  # Semi-transparent for glass effect
  menu_text = "rgba(30, 35, 44, 0.60)"  # Softer muted text
  menu_text_active = "rgba(30, 35, 44, 1)"  # Strong active text
  menu_title = "#1e232c"  # Deep neutral

  # Home sections
  home_section_odd = "rgb(249, 250, 254)"  # Faint indigo tint, very subtle
  home_section_even = "rgb(255, 255, 255)"  # Pure white, alternating
